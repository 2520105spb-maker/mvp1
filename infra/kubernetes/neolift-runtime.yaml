apiVersion: v1
kind: Namespace
metadata:
  name: neolift-prod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: neolift-runtime-config
  namespace: neolift-prod
data:
  NODE_ENV: "production"
  NEXT_PUBLIC_APP_ENV: "production"
  REDIS_KEY_PREFIX: "neolift:prod"
  S3_BUCKET_MEDIA: "neolift-media-prod"
  S3_BUCKET_REPORTS: "neolift-reports-prod"
---
apiVersion: v1
kind: Secret
metadata:
  name: neolift-runtime-secrets
  namespace: neolift-prod
type: Opaque
stringData:
  DATABASE_URL: "postgresql://CHANGE_ME"
  REDIS_URL: "redis://CHANGE_ME"
  S3_ENDPOINT: "https://s3.example.internal"
  S3_ACCESS_KEY_ID: "CHANGE_ME"
  S3_SECRET_ACCESS_KEY: "CHANGE_ME"
  JWT_PRIVATE_KEY: "CHANGE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neolift-web
  namespace: neolift-prod
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: neolift-web
  template:
    metadata:
      labels:
        app: neolift-web
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: web
          image: registry.example.com/neolift/erp-app:CHANGE_ME
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: neolift-runtime-config
            - secretRef:
                name: neolift-runtime-secrets
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neolift-critical-workers
  namespace: neolift-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: neolift-critical-workers
  template:
    metadata:
      labels:
        app: neolift-critical-workers
    spec:
      terminationGracePeriodSeconds: 90
      containers:
        - name: workers
          image: registry.example.com/neolift/erp-worker:CHANGE_ME
          command: ["node", "scripts/runtime/queue-worker.mjs"]
          args: ["--queues=emergency,sla,notifications,dispatch"]
          envFrom:
            - configMapRef:
                name: neolift-runtime-config
            - secretRef:
                name: neolift-runtime-secrets
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neolift-media-workers
  namespace: neolift-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: neolift-media-workers
  template:
    metadata:
      labels:
        app: neolift-media-workers
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: workers
          image: registry.example.com/neolift/erp-worker:CHANGE_ME
          command: ["node", "scripts/runtime/queue-worker.mjs"]
          args: ["--queues=media-processing,ocr,ai-validation,pdf-generation,exports"]
          envFrom:
            - configMapRef:
                name: neolift-runtime-config
            - secretRef:
                name: neolift-runtime-secrets
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: neolift-web
  namespace: neolift-prod
spec:
  selector:
    app: neolift-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neolift-web
  namespace: neolift-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neolift-web
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neolift-critical-workers
  namespace: neolift-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neolift-critical-workers
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
